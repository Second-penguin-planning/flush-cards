<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなの日本語 フラッシュカード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .category-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.active {
            background-color: #2c3e50;
            font-weight: bold;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* フラッシュカードのスタイル */
        .card-container {
            width: 320px;
            height: 220px;
            perspective: 1000px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-front {
            background-color: white;
            color: #2c3e50;
        }
        .card-back {
            background-color: #e8f6f3;
            color: #16a085;
            transform: rotateY(180deg);
        }
        .english-text {
            font-size: 16px;
            color: #7f8c8d;
            margin-top: 10px;
        }
        
        /* ナビゲーション */
        .nav-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .counter {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>みん日 フラッシュカード (〜13課)</h1>

    <div class="category-buttons">
        <button id="btn-words" class="active" onclick="setCategory('words')">単語</button>
        <button id="btn-grammar" onclick="setCategory('grammar')">文法</button>
        <button id="btn-kanji" onclick="setCategory('kanji')">漢字</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div id="card-front-text"></div>
            </div>
            <div class="card-face card-back">
                <div id="card-back-text"></div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <button id="btn-prev" onclick="prevCard()">◀ 前へ</button>
        <div class="counter" id="card-counter">1 / 20</div>
        <button id="btn-next" onclick="nextCard()">次へ ▶</button>
    </div>

    <script>
        // 問題データ（13課までの内容・各20問）
        // NOTION_SYNC_START
        const deck = {
                  words: [],
                  grammar: [],
                  kanji: []
        };
        // NOTION_SYNC_END

        let currentCategory = 'words';
        let currentIndex = 0;

        function updateCard() {
            const cardElement = document.getElementById('flashcard');
            const data = deck[currentCategory][currentIndex];
            
            // 裏返っている場合は表面に戻す
            cardElement.classList.remove('is-flipped');
            
            // テキストの更新（アニメーション完了後に書き換えるため少し遅延させる）
            setTimeout(() => {
                document.getElementById('card-front-text').innerHTML = data.front;
                document.getElementById('card-back-text').innerHTML = 
                    `${data.back}<br><span class="english-text">${data.english}</span>`;
            }, 150);

            // カウンターとボタンの更新
            document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${deck[currentCategory].length}`;
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === deck[currentCategory].length - 1;
        }

        function setCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            
            // ボタンのアクティブ状態を切り替え
            document.getElementById('btn-words').classList.remove('active');
            document.getElementById('btn-grammar').classList.remove('active');
            document.getElementById('btn-kanji').classList.remove('active');
            document.getElementById(`btn-${category}`).classList.add('active');
            
            updateCard();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            card.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < deck[currentCategory].length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // 初期化
        updateCard();
    </script>
</body>
</html>
