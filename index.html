    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .category-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.active {
            background-color: #2c3e50;
            font-weight: bold;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* フラッシュカードのスタイル */
        .card-container {
            width: 512px;
            height: 352px;
            perspective: 1000px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 38px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-front {
            background-color: white;
            color: #2c3e50;
        }
        .card-back {
            background-color: #e8f6f3;
            color: #16a085;
            transform: rotateY(180deg);
        }
        .english-text {
            font-size: 26px;
            color: #7f8c8d;
            margin-top: 10px;
        }

        /* ナビゲーション */
        .nav-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .counter {
            font-size: 29px;
            font-weight: bold;
        }

        /* 課選択画面 */
        .lesson-buttons button {
            padding: 20px 40px;
            font-size: 20px;
        }
        .back-button {
            align-self: flex-start;
            background-color: #7f8c8d;
            margin-bottom: 15px;
        }
        .back-button:hover {
            background-color: #626d6e;
        }
        #flashcard-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        #lesson-title {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>みん日 フラッシュカード</h1>

    <div id="lesson-select-screen" class="category-buttons lesson-buttons">
        <button onclick="selectLesson('13')">〜13課</button>
        <button onclick="selectLesson('29')">29課</button>
    </div>

    <div id="flashcard-screen" style="display: none;">
        <button class="back-button" onclick="showLessonSelect()">← 課選択に戻る</button>
        <h2 id="lesson-title"></h2>

        <div class="category-buttons">
            <button id="btn-words" class="active" onclick="setCategory('words')">単語</button>
            <button id="btn-grammar" onclick="setCategory('grammar')">文法</button>
            <button id="btn-kanji" onclick="setCategory('kanji')">漢字</button>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div id="card-front-text"></div>
                </div>
                <div class="card-face card-back">
                    <div id="card-back-text"></div>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <button id="btn-prev" onclick="prevCard()">◀ 前へ</button>
            <div class="counter" id="card-counter">1 / 20</div>
            <button id="btn-next" onclick="nextCard()">次へ ▶</button>
        </div>

                { front: "駅（えき）の建（たて）物（もの）は（　　）、壁（かべ）の時計（とけい）は止（と）まっています。", back: "壊（こわ）れて", english: "(The station building is broken)" },
                { front: "古（ふる）いビルが駅前（えきまえ）の広（ひろ）い道（みち）に（　　）。", back: "倒（たお）れています", english: "(An old building has fallen down)" },
                { front: "駅（えき）の西（にし）の方（ほう）では今（いま）もうちが（　　）。", back: "燃（も）えています", english: "(Houses are burning)" }
            ],
            kanji: [
                { front: "袋", back: "ふくろ", english: "(bag)" },
                { front: "書類", back: "しょるい", english: "(document)" },
                { front: "枝", back: "えだ", english: "(branch)" },
                { front: "返事", back: "へんじ", english: "(reply)" },
                { front: "壁", back: "かべ", english: "(wall)" }
            ]
        }
        };

        let currentLesson = null;
        let currentCategory = 'words';
        let currentIndex = 0;

        function selectLesson(lessonId) {
            currentLesson = lessonId;
            currentCategory = 'words';
            currentIndex = 0;

            document.getElementById('lesson-select-screen').style.display = 'none';
            document.getElementById('flashcard-screen').style.display = 'flex';
            document.getElementById('lesson-title').innerText = lessonLabels[lessonId];

            document.getElementById('btn-words').classList.add('active');
            document.getElementById('btn-grammar').classList.remove('active');
            document.getElementById('btn-kanji').classList.remove('active');

            updateCard();
        }

        function showLessonSelect() {
            document.getElementById('flashcard-screen').style.display = 'none';
            document.getElementById('lesson-select-screen').style.display = 'flex';
            currentLesson = null;
        }

        function updateCard() {
            const cardElement = document.getElementById('flashcard');
            const data = deck[currentLesson][currentCategory][currentIndex];

            // 裏返っている場合は表面に戻す
            cardElement.classList.remove('is-flipped');

            // テキストの更新（アニメーション完了後に書き換えるため少し遅延させる）
            setTimeout(() => {
                document.getElementById('card-front-text').innerHTML = data.front;
                document.getElementById('card-back-text').innerHTML =
                    `${data.back}<br><span class="english-text">${data.english}</span>`;
            }, 150);

            // カウンターとボタンの更新
            document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${deck[currentLesson][currentCategory].length}`;
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === deck[currentLesson][currentCategory].length - 1;
        }

        function setCategory(category) {
            currentCategory = category;
            currentIndex = 0;

            // ボタンのアクティブ状態を切り替え
            document.getElementById('btn-words').classList.remove('active');
            document.getElementById('btn-grammar').classList.remove('active');
            document.getElementById('btn-kanji').classList.remove('active');
            document.getElementById(`btn-${category}`).classList.add('active');

            updateCard();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            card.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < deck[currentLesson][currentCategory].length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }
    </script>
</body>
</html>
